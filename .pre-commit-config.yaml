---
ci:
  skip: [uv-sync, mypy]
  autofix_prs: false
  autoupdate_schedule: quarterly

# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
minimum_pre_commit_version: 4.0.0
default_stages: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: trailing-whitespace
      - id: check-toml
      - id: end-of-file-fixer
        exclude_types: [svg]
      - id: mixed-line-ending
      - id: check-yaml
      - id: pretty-format-json
      - id: detect-private-key
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: ef6cf06c079dd6b299dfc720b0f14400c9d168e1  # frozen: v0.17.5
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix, --respect-gitignore, --show-fixes]
      - id: ruff-format

  - repo: https://github.com/rstcheck/rstcheck
    rev: ee160e7d8f0f9f25a9b37492312c23757b1ab38a  # frozen: v6.3.1
    hooks:
      - id: rstcheck
        additional_dependencies: [sphinx, toml]

  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: 02ef6d1c28994054a843e58604e1a343faa42987  # frozen: v2.31.2
    hooks:
      - id: pyproject-fmt

  - repo: https://github.com/fizyk/pyproject-validator
    rev: dba43a3da860553a5d41824ef949c244658cd6d1  # frozen: v1.1.0
    hooks:
      - id: check-python-version-consistency

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: 06a39750ec31860bb44f2acf67182c40016cd1e7  # frozen: v1.32.0
    hooks:
      - id: zizmor
        args: [--no-progress, --fix]

  - repo: https://github.com/kjanat/actionlint
    rev: 220b76cfa568e00ed8b3c476898f849a722b88e2  # frozen: v1.17.1
    hooks:
      - id: actionlint

  - repo: local
    hooks:
      - id: uv-sync
        stages: [pre-commit, manual]
        language: system
        name: Install dependencies for the local linters
        entry: uv sync
        types_or:
          - python
          - toml  # pyproject.toml
        pass_filenames: false
      - id: mypy
        stages: [pre-commit, manual]
        name: mypy
        entry: uv run mypy .
        language: system
        types_or:
          - python
          - toml  # pyproject.toml
        pass_filenames: false
