[build-system]
build-backend = "uv_build"
requires = [ "uv-build>=0.12,<0.13" ]

[project]
name = "pytest-redis"
version = "4.0.0"
description = "Redis fixtures and fixture factories for Pytest."
readme = "README.rst"
keywords = [ "fixture", "pytest", "redis", "tests" ]
license = "LGPL-3.0-or-later"
license-files = [ "COPYING.lesser" ]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "mirakuru>=2.6.0",
    "packaging",
    "port-for>=0.7.3",
    "pytest>=8.4.0",
    "redis>=5.0.1",
]

[[project.authors]]
name = "Grzegorz Śliwiński"
email = "fizyk+pypi@fizyk.dev"

[project.optional-dependencies]
async = [
    "pytest-asyncio>=1.0.0",
]

[project.urls]
Source = "https://github.com/dbfixtures/pytest-redis"
"Bug Tracker" = "https://github.com/dbfixtures/pytest-redis/issues"
Changelog = "https://github.com/dbfixtures/pytest-redis/blob/v4.0.0/CHANGES.rst"

[project.entry-points.pytest11]
pytest_redis = "pytest_redis.plugin"

[dependency-groups]
dev = [
    "coverage==7.15.4",
    "mirakuru==3.0.2",
    "mock==5.2.0",
    "mypy==2.3.1; implementation_name=='cpython'",
    "packaging==26.3",
    "port-for==1.0.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-xdist==3.8.0",
    "redis==7.4.0",
    "towncrier==25.8.0",
    "types-mock==5.2.0.20260518",
]
release = [
    "tbump==6.11.0",
]

[tool.uv.build-backend]
module-name = "pytest_redis"
module-root = ""
source-include = [ "CHANGES.rst" ]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E", # pycodestyle
    "F", # pyflakes
    "I", # isort
    "D", # pydocstyle
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.pyproject-fmt]
column_width = 120
indent = 4
keep_full_version = true
generate_python_version_classifiers = false
table_format = "long"
sub_table_spacing = "\n"

[tool.pytest]
addopts = [ "--showlocals", "--verbose" ]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "strict"
testpaths = [ "tests" ]
xfail_strict = true

[tool.tbump]

[[tool.tbump.before_commit]]
name = "Build changelog"
cmd = "uv run towncrier build --version {new_version} --yes"

[[tool.tbump.field]]
name = "extra"
default = ""

[[tool.tbump.file]]
src = "pytest_redis/__init__.py"

[[tool.tbump.file]]
src = "pyproject.toml"
search = 'version = "{current_version}"'

[[tool.tbump.file]]
src = "pyproject.toml"
search = 'Changelog = "https://github.com/dbfixtures/pytest-redis/blob/v{current_version}/CHANGES.rst"'

[tool.tbump.git]
message_template = "Release {new_version}"
tag_template = "v{new_version}"

[tool.tbump.version]
current = "4.0.0"
regex = '''
  (?P<major>\d+)
  \.
  (?P<minor>\d+)
  \.
  (?P<patch>\d+)
  (\-
    (?P<extra>.+)
  )?
  '''

[tool.towncrier]
directory = "newsfragments"
filename = "CHANGES.rst"
issue_format = "`#{issue} <https://github.com/dbfixtures/pytest-redis/issues/{issue}>`__"
single_file = true

[[tool.towncrier.type]]
directory = "break"
name = "Breaking changes"
showcontent = true

[[tool.towncrier.type]]
directory = "depr"
name = "Deprecations"
showcontent = true

[[tool.towncrier.type]]
directory = "feature"
name = "Features"
showcontent = true

[[tool.towncrier.type]]
directory = "bugfix"
name = "Bugfixes"
showcontent = true

[[tool.towncrier.type]]
directory = "docs"
name = "Documentation"
showcontent = true

[[tool.towncrier.type]]
directory = "misc"
name = "Miscellaneus"
showcontent = true

[tool.rstcheck]
report_level = "warning"
