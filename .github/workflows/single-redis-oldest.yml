name: Run pytest tests

on:
  workflow_call:
    inputs:
      python-versions:
        description: 'Supported python versions'
        default: '["3.10", "3.11", "3.12", "3.13", "3.14", "pypy-3.11"]'
        required: false
        type: string
      redis-versions:
        description: 'Redis versions'
        required: true
        type: string
      os:
        description: 'Operating system to run tests on'
        default: 'ubuntu-latest'
        required: false
        type: string
    secrets:
      codecov_token:
        description: 'Codecov token'
        required: false


jobs:
  redis:
    runs-on: ${{ inputs.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(inputs.python-versions) }}
        redis-version: ${{ fromJSON(inputs.redis-versions) }}
    env:
      OS: ${{ inputs.os }}
      PYTHON: ${{ matrix.python-version }}
      REDIS_VERSION: ${{ matrix.redis-version }}
      UV_NO_SYNC: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Cache Redis builds
        uses: actions/cache@v5
        with:
          path: ~/redis
          key: redis-${{ hashFiles('.download-redis.sh') }}
      - name: Set up uv with python ${{ matrix.python-version }}
        uses: fizyk/actions-reuse/.github/actions/uv-setup@7eefbd6ffc6c6787ad3be6ce93dcf475e3ae99b5 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install oldest supported versions
        uses: fizyk/actions-reuse/.github/actions/uv-run@7eefbd6ffc6c6787ad3be6ce93dcf475e3ae99b5 # v5.6.0
        with:
          command: pip install -r oldest/requirements.txt
      - name: Run test on Redis ${{ matrix.redis-version }}
        uses: fizyk/actions-reuse/.github/actions/uv-pytest-coverage@7eefbd6ffc6c6787ad3be6ce93dcf475e3ae99b5 # v5.6.0
        with:
          pytest-opts: -c pyproject.oldest.toml -p no:xdist --redis-exec=$HOME/redis/redis-${{ matrix.redis-version }}/src/redis-server
          data-file: .coverage.serial
          output-file: coverage-serial.xml

      - name: Run xdist test on Redis ${{ matrix.redis-version }}
        uses: fizyk/actions-reuse/.github/actions/uv-pytest-coverage@7eefbd6ffc6c6787ad3be6ce93dcf475e3ae99b5 # v5.6.0
        with:
          pytest-opts: -c pyproject.oldest.toml -n auto --max-worker-restart=0 --redis-exec=$HOME/redis/redis-${{ matrix.redis-version }}/src/redis-server
          coverage-config: .coveragerc
          data-file: .coverage.xdist
          output-file: coverage-xdist.xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          flags: linux,redis-${{ matrix.redis-version }}
          env_vars: OS,PYTHON,REDIS_VERSION
          files: coverage.xml,coverage-xdist.xml
          fail_ci_if_error: false
          token: ${{ secrets.codecov_token }}
