version: 2
updates:
- package-ecosystem: uv
  directories:
    - "/"
  exclude-paths:
    - "oldest/*"
  schedule:
    interval: daily
    time: "04:00"
  open-pull-requests-limit: 2
  cooldown:
    default-days: 7
  groups:
    mock:
      patterns:
      - "mock"
      - "types-mock"
  commit-message:
    prefix: " "
- package-ecosystem: github-actions
  directories:
  - "/"
  schedule:
    interval: daily
    time: "04:00"
  open-pull-requests-limit: 1
  cooldown:
    default-days: 7
  groups:
    fizyk-actions-reuse:
      patterns:
      - "fizyk/actions-reuse/*"
    checkout:
      patterns:
      - "actions/checkout"
    cache:
      patterns:
      - "actions/cache"
    codecov:
      patterns:
      - "codecov/codecov-action"
  commit-message:
    prefix: " "
- package-ecosystem: pre-commit
  directory: "/"
  schedule:
    interval: daily
    time: "04:10"
  open-pull-requests-limit: 1
  cooldown:
    default-days: 7
